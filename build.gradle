plugins {
    id 'java'
    id 'war'
}

group = 'vn.codegym'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

ext {
    junitVersion = '5.10.2'
}

sourceCompatibility = '1.8'
targetCompatibility = '1.8'

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}

dependencies {
    // Servlet API do Tomcat cung cấp -> không đóng gói vào WAR
    compileOnly 'javax.servlet:javax.servlet-api:4.0.1'
    providedRuntime 'javax.servlet:javax.servlet-api:4.0.1'

    // JSTL/Taglibs (đóng gói vào WAR để JSP chạy được)
    implementation 'org.apache.taglibs:taglibs-standard-spec:1.2.5'
    runtimeOnly 'org.apache.taglibs:taglibs-standard-impl:1.2.5'

    // MySQL JDBC
    implementation 'com.mysql:mysql-connector-j:8.0.33'
}
    dependencies {
    // ZXing (QR)
    implementation 'com.google.zxing:core:3.5.3'
    implementation 'com.google.zxing:javase:3.5.3'

    // JavaMail (javax.mail cho JDK 8 / Tomcat 9)
    implementation 'com.sun.mail:javax.mail:1.6.2'
    // một số môi trường cần thêm activation
    implementation 'com.sun.activation:javax.activation:1.2.0'

    // HMAC/Hex cho SignUtil
    implementation 'commons-codec:commons-codec:1.16.0'

    // Test
    testImplementation "org.junit.jupiter:junit-jupiter-api:${junitVersion}"
    testRuntimeOnly    "org.junit.jupiter:junit-jupiter-engine:${junitVersion}"
}

test {
    useJUnitPlatform()
}

war {
    // đặt tên WAR đúng context cho Tomcat
    archiveBaseName = 'event-ticketing'
}
